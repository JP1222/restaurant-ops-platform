# GitHub secret scanning — ignore paths that only hold test fixtures and
# committed dev-only dummy values (realistic-looking fake tokens used to test
# the redaction / looksLikeSecret logic). No real secrets live in these paths.
paths-ignore:
  - "**/*.test.ts"
  - "**/tests/**"
  - "**/vitest*.config.ts"
  - "scripts/dev-defaults.sh"
  - "**/*.env.example"
