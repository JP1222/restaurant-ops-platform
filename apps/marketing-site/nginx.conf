server {
  listen 80 default_server;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # ---- Security headers ---------------------------------------------------
  # Marketing site needs to load:
  #   - Google Fonts CSS (fonts.googleapis.com) + woff2 files (fonts.gstatic.com)
  #   - Our own /script.js for the menu tabs, gift card amount picker, and
  #     scroll-aware nav. No third-party JS, no analytics, no tracking.
  # Therefore CSP relaxes script-src to 'self' (vs legal-site's 'none') but
  # nothing else. No 'unsafe-inline' on scripts.
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; script-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;

  server_tokens off;

  # Clean URLs: /menu -> /menu.html (room to grow into multi-page later).
  location / {
    try_files $uri $uri.html $uri/ =404;
  }

  # HTML: short cache so menu/copy updates land fast.
  location ~* \.html$ {
    add_header Cache-Control "public, max-age=300, must-revalidate" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; script-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
  }

  # CSS / JS: longer cache. Re-deploy bumps the image tag, so a stale browser
  # cache only shows old content until the user hard-refreshes — fine for a
  # brochure site. If/when we add asset hashing in build.mjs, bump to 1y.
  location ~* \.(css|js)$ {
    add_header Cache-Control "public, max-age=3600" always;
  }

  # Images: long cache. The signature/storefront photos change rarely; when
  # they do, the file names will change and the cache busts naturally.
  location ~* \.(png|jpg|jpeg|svg|webp|avif|ico)$ {
    add_header Cache-Control "public, max-age=604800, immutable" always;
  }

  # Compress text responses.
  gzip on;
  gzip_vary on;
  gzip_min_length 256;
  gzip_proxied any;
  gzip_types text/plain text/css text/html application/javascript application/json image/svg+xml;

  # Block dotfiles (.git, .DS_Store, etc.) just in case something leaks
  # into the image during build.
  location ~ /\. {
    deny all;
    access_log off;
    log_not_found off;
  }
}
