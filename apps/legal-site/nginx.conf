server {
  listen 80 default_server;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # ---- Security headers (mirror the CF Pages _headers file we previously
  # used; nginx is now the source of truth) -----------------------------------
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Content-Security-Policy "default-src 'self'; style-src 'self'; img-src 'self' data:; script-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;

  # Hide nginx version from the Server header.
  server_tokens off;

  # Clean URLs: /eula -> /eula.html, /privacy -> /privacy.html, /support -> /support.html
  location / {
    try_files $uri $uri.html $uri/ =404;
  }

  # Don't cache the HTML hard — legal text can change and we want updates
  # to propagate quickly. CSS is content-addressed effectively (we only
  # ship one file), so a short browser cache is fine.
  location ~* \.html$ {
    add_header Cache-Control "public, max-age=300, must-revalidate" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self'; img-src 'self' data:; script-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
  }

  # Compress text responses.
  gzip on;
  gzip_vary on;
  gzip_min_length 256;
  gzip_proxied any;
  gzip_types text/plain text/css text/html application/javascript application/json image/svg+xml;

  # Block dotfiles (.git, .DS_Store, etc.) just in case something leaks
  # into the image during build.
  location ~ /\. {
    deny all;
    access_log off;
    log_not_found off;
  }
}
